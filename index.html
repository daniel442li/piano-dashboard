*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
header{padding:22px 24px 8px;max-width:1400px;margin:0 auto}
h1{margin:0 0 4px;font-size:22px;letter-spacing:.2px}h1 span{color:var(--mut);font-weight:500;font-size:14px;margin-left:8px}
.sub{color:var(--mut);font-size:12.5px}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0 4px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:110px}
.stat b{display:block;font-size:20px}.stat small{color:var(--mut);font-size:11.5px;text-transform:uppercase;letter-spacing:.6px}
.apps{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer;user-select:none}

.bar{position:sticky;top:0;z-index:5;background:rgba(13,15,20,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.controls{max-width:1400px;margin:0 auto;padding:10px 24px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,input[type=search]{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:13px}
input[type=search]{min-width:200px;flex:1 1 200px}
.btn{background:var(--acc);color:#0b1020;border:0;border-radius:9px;padding:8px 14px;font-weight:600;cursor:pointer;font-size:13px}
.btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.count{color:var(--mut);font-size:12.5px;margin-left:auto}
main{max-width:1400px;margin:0 auto;padding:16px 24px 60px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px;cursor:pointer;position:relative;overflow:hidden;transition:transform .12s,border-color .12s}
.card:hover{transform:translateY(-2px);border-color:#3a4360}
.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--t)}
.card[data-tier=strong]{--t:var(--strong)}.card[data-tier=medium]{--t:var(--medium)}.card[data-tier=weak]{--t:var(--weak)}
.ch{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.handle{font-weight:700;font-size:15.5px;word-break:break-all}
.rank{color:var(--mut);font-size:12px;margin-right:4px}
.tier{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;padding:3px 8px;border-radius:999px;color:#0b0d12;background:var(--t);white-space:nowrap}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}
.b{font-size:11.5px;padding:2px 8px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);color:var(--text)}
.b.ig{border-color:#6b2f5e;background:#25131f;color:#f5a6dc}.b.ig:hover{text-decoration:none;border-color:#e07bc4}

.igc.confirmed{background:#e07bc4;color:#1a0915}.igc.likely{background:transparent;border:1px dashed #8a5a7c;color:#b88aa9;opacity:.75}
.b.pf{font-weight:600}.b.pf-tiktok{border-color:#2d3a55;background:#141c2e;color:#a9c1ff}.b.pf-instagram{border-color:#7a2f6a;background:linear-gradient(90deg,#3a1430,#2a1a3c);color:#ffc2ea}.b.pf-both{border-color:#4b3b6e;background:#1e1832;color:#d6c8ff}

.igcta b{font-size:18px;word-break:break-all}.igcta .igbtn{background:#fff;color:#7b1e5d;border-radius:999px;padding:8px 16px;font-weight:700;font-size:13px}.igcta .igbtn:hover{text-decoration:none;opacity:.9}.igcta small{opacity:.9;font-size:11.5px;max-width:90%}
.igw{display:inline-flex;gap:4px;align-items:center}

.n{background:var(--panel2);border-radius:9px;padding:6px 8px}.n b{display:block;font-size:15px}.n small{color:var(--mut);font-size:10.5px;text-transform:uppercase;letter-spacing:.5px}

.vc{color:var(--acc);font-size:12px;margin-top:8px;font-weight:600}
.empty{color:var(--mut);text-align:center;padding:60px 0}

.pl{position:relative;width:100%;aspect-ratio:9/16;max-height:600px;background:#000;border-radius:10px;overflow:hidden;margin:8px 0 6px;cursor:default}
.pl iframe,.fr iframe,.fbox iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;text-align:center;color:#c6cbd8;font-size:12.5px;cursor:pointer;background:radial-gradient(circle at 50% 40%,#1d2335,#07080b)}

.ph .pc{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;max-width:92%}
.pl.none{aspect-ratio:auto;padding:24px;text-align:center;color:var(--mut)}
.pnav{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);flex-wrap:wrap}

.card.playing{border-color:var(--acc)}
.vc{background:none;border:0;padding:0;cursor:pointer;font:inherit;font-size:12px}

.ov.show{display:flex}
.modal{background:var(--bg);border:1px solid var(--line);width:min(1250px,100%);margin:3vh 12px;border-radius:16px;overflow:auto;position:relative}

function igCTA(c){const g=c.ig;const u=g?g.url:c._url;const h=g?g.handle:c.handle;
 return `<div class="igcta"><div style="font-size:30px">📸</div><b>@${esc(h)}</b><span>${g&&g.followers_txt?esc(g.followers_txt)+' Instagram followers':'Instagram creator'}</span>
 <a class="igbtn" href="${esc(u)}" target="_blank" rel="noopener">Watch their reels on Instagram ↗</a><small>No reel links on file yet, so videos can't play here. Instagram opens in a new tab.</small></div>`;}
const IGTIP={likely:'matched by name, not linked from their profile'};
function igHTML(c){const g=c.ig;if(!g)return '';const tip=g.conf=='likely'?IGTIP.likely:('confirmed'+(g.source?': '+g.source:''));
 return `<span class="igw"><a class="b ig" href="${esc(g.url)}" target="_blank" rel="noopener" title="Instagram">📸 IG @${esc(g.handle)}${g.followers_txt?' · '+esc(g.followers_txt):''}</a><span class="igc ${g.conf}" title="${esc(tip)}">${g.conf}</span></span>`;}
const promoTag=v=>v.promo?'<span class="promo">APP MENTION</span>':'';
const vline=v=>`${fmt(v.views)} views · ${esc(v.date)}${v.dur?` · ${v.dur}s`:''}`;
$('#foot').textContent=`Source: piano_promo_creators.csv + yt-dlp metadata. Videos are official TikTok embeds; they load as cards scroll into view and start muted (browsers block autoplay with sound).`;
// ---- grid
function filtered(){const q=$('#q').value.trim().toLowerCase(),t=$('#fTier').value,g=$('#fGroup').value,a=$('#fApp').value,f=$('#fFace').value,s=$('#sort').value,ig=$('#fIG').value,pf=$('#fPf').value;
 let r=D.filter(c=>(!t||c.fit==t)&&(!g||(g=='Tied'?tied(c):!tied(c)))&&(!a||c._app==a)&&(!f||c._face==f)&&(!pf||c._pf==pf)&&(!ig||(ig=='confirmed'?c.ig&&c.ig.conf=='confirmed':ig=='has'?!!c.ig:!c.ig))&&
   (!q||(c.handle+' '+c.content_style+' '+c.fit_note+' '+c.app_tie+' '+c.language).toLowerCase().includes(q.replace(/^@/,''))));
 const key={rank:c=>-c.rank,median:c=>c.median_views_last20||0,followers:c=>c.followers||0,ratio:c=>c._ratio||0,ppw:c=>c.posts_per_week||0,igf:c=>(c.ig&&c.ig.followers)||c.ig_followers_num||0}[s];
 return r.sort((x,y)=>key(y)-key(x));}
const phHTML=v=>`<div class="ph" title="Play"><div class="pb">▶</div>${promoTag(v)}<div class="pc">${esc(v.cap||'')}</div><div class="sub">${vline(v)}</div></div>`;
function navHTML(c){const v=c._vids[c._i];return `<button data-d="-1" aria-label="Previous video">◀</button><span class="pi">${c._i+1}/${c._vids.length}</span><button data-d="1" aria-label="Next video">▶</button><span>${promoTag(v)}${vline(v)}</span><a href="${vurl(c,v)}" target="_blank" rel="noopener">TikTok ↗</a>`;}
let ACTIVE=null,GRID_PAUSED=false;const VIS=new Set();
const cardF=card=>card&&card.querySelector('.pl iframe');
function loadCard(card,play){const c=BY[card.dataset.h],pl=card.querySelector('.pl');if(!c||!c._vids.length||!pl)return;
 const cur=cardF(card);if(cur){if(play){if(cur.dataset.ready)playF(cur);else if(cur.src.includes('autoplay=0'))pl.replaceChildren(mkFrame(c._vids[c._i].id,'card',{auto:true,loop:true}));else cur.dataset.play='1';}return;}
 pl.replaceChildren(mkFrame(c._vids[c._i].id,'card',{auto:play,loop:true}));}
function unloadCard(card){const c=BY[card.dataset.h],pl=card.querySelector('.pl');if(!c||!c._vids.length||!pl||!pl.querySelector('iframe'))return;
 if(card===ACTIVE){ACTIVE=null;card.classList.remove('playing');}pl.innerHTML=phHTML(c._vids[c._i]);}
function setActive(card,already){if(ACTIVE&&ACTIVE!==card){pauseF(cardF(ACTIVE));ACTIVE.classList.remove('playing');}
 ACTIVE=card;if(!card)return;card.classList.add('playing');if(GRID_PAUSED)return;
 if(already){const f=cardF(card);if(f)f.dataset.play='1';}else loadCard(card,true);}
function pickActive(){if(GRID_PAUSED)return;if(ACTIVE&&VIS.has(ACTIVE)){loadCard(ACTIVE,true);return;}
 const first=[...document.querySelectorAll('#grid .card')].find(el=>VIS.has(el));setActive(first||null);}
function step(card,d){const c=BY[card.dataset.h];if(!c||c._vids.length<2)return;c._i=(c._i+d+c._vids.length)%c._vids.length;
 card.querySelector('.pnav').innerHTML=navHTML(c);const pl=card.querySelector('.pl');pl.replaceChildren(mkFrame(c._vids[c._i].id,'card',{auto:true,loop:true}));setActive(card,true);}
const ioNear=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)loadCard(e.target.closest('.card'),false)}),{rootMargin:'250px 0px'});
const ioFar=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)unloadCard(e.target.closest('.card'))}),{rootMargin:'1400px 0px'});
let pickT=null;
const ioVis=new IntersectionObserver(es=>{es.forEach(e=>{const card=e.target.closest('.card');if(e.isIntersecting&&e.intersectionRatio>=.6)VIS.add(card);else VIS.delete(card);});
 clearTimeout(pickT);pickT=setTimeout(pickActive,250);},{threshold:[0,.6,1]});
function render(){const r=filtered();
 document.querySelectorAll('#apps .chip').forEach(ch=>ch.classList.toggle('on',ch.dataset.app==$('#fApp').value));
 $('#count').textContent=`${r.length} of ${D.length} creators`;$('#empty').hidden=r.length>0;
 [ioNear,ioFar,ioVis].forEach(o=>o.disconnect());VIS.clear();ACTIVE=null;
 $('#grid').innerHTML=r.map(c=>`<div class="card" data-tier="${c.fit}" data-h="${esc(c.handle)}" tabindex="0">
  <div class="ch"><div><span class="rank">#${c.rank}</span><a class="handle" href="${c._url}" target="_blank" rel="noopener">@${esc(c.handle)}</a></div><span class="tier">${c.fit}</span></div>
  <div class="badges">${PFB(c)}${tied(c)?`<span class="b tied">Tied · ${esc(c._app)}</span>`:`<span class="b free">Not tied to an app</span>`}
   <span class="b">${esc(c.partnership_type)}</span><span class="b">Face: ${esc(c.face_on_camera.split('(')[0].trim())}</span>${c.language?`<span class="b">${esc(c.language.split('(')[0].trim())}</span>`:''}${igHTML(c)}</div>
  <div class="nums"><div class="n"><b>${fmt(c.followers)}</b><small>${c._pf=='instagram'?'IG followers':'TikTok foll.'}</small></div><div class="n"><b>${fmt(c.median_views_last20)}</b><small>${c.median_views_last20==null&&c._pf=='instagram'?'IG views n/a':'TikTok median'}</small></div><div class="n"><b>${c._ratio==null?'—':c._ratio.toFixed(2)}</b><small>Views/foll.</small></div></div>
  ${c._vids.length?`<div class="pl">${phHTML(c._vids[c._i])}</div><div class="pnav">${navHTML(c)}</div>`:(c.ig||c._pf=='instagram'?igCTA(c):`<div class="pl none">No video data · <a href="${c._url}" target="_blank" rel="noopener">open profile</a></div>`)}
  <div class="note">${esc(c.fit_note)}</div>
  <div class="meta">${esc(c.content_style)} · ${c.posts_per_week??'—'}/wk · last post ${esc(c.last_post)}</div>
  <div class="meta">✉ ${linkify(c.contact||'—')}</div>
  <button class="vc">⤢ Details + all ${c._vids.length} videos${c._vids.some(v=>v.promo)?` · ${c._vids.filter(v=>v.promo).length} app mention`:''}</button></div>`).join('');
 document.querySelectorAll('#grid .card').forEach(el=>{
  el.onclick=e=>{const nb=e.target.closest('.pnav button');if(nb){step(el,+nb.dataset.d);return;}
   if(e.target.closest('.ph')){setActive(el);return;}
   if(e.target.closest('a,.pl,.pnav'))return;openCreator(el.dataset.h,BY[el.dataset.h]._i);};
  el.onkeydown=e=>{if(e.target!==el)return;if(e.key=='Enter')openCreator(el.dataset.h,BY[el.dataset.h]._i);if(e.key=='ArrowRight')step(el,1);if(e.key=='ArrowLeft')step(el,-1);};
  const pl=el.querySelector('.pl:not(.none)');if(pl){ioNear.observe(pl);ioFar.observe(pl);ioVis.observe(pl);}});}
['#q','#fTier','#fGroup','#fApp','#fFace','#fPf','#fIG','#sort'].forEach(s=>$(s).addEventListener('input',render));
function gridPause(){GRID_PAUSED=true;document.querySelectorAll('#grid iframe[data-tt]').forEach(pauseF);}
function gridResume(){GRID_PAUSED=false;pickActive();}
// ---- one big player + list (creator panel and watch queue)
let M={on:false,list:[],i:0,auto:true,timer:null};
function closeM(){M.on=false;clearTimeout(M.timer);$('#ov').classList.remove('show');$('#modal').innerHTML='';document.body.style.overflow='';
 if(location.hash&&location.hash!='#feed')history.replaceState(null,'',' ');gridResume();}
$('#ov').onclick=e=>{if(e.target.id=='ov')closeM()};
function openPlayer(head,list,start,below){gridPause();M={on:true,list,i:0,auto:M.auto!==false,timer:null};
 $('#modal').innerHTML=`<div class="mh">${head}<button class="btn ghost snd">${SOUND?'🔊 Sound on':'🔇 Sound off'}</button><button class="x" aria-label="Close">✕</button></div>
 <div class="q"><div><div class="fr" id="mfr"></div>
  <div class="qnav"><button class="btn ghost" id="mp">◀ Prev</button><button class="btn" id="mn">Next ▶</button>
   <label class="sub"><input type="checkbox" id="ma" ${M.auto?'checked':''}> Auto-advance</label><span class="sub" id="mpos"></span></div>
  <div class="qnow" id="mnow"></div></div>
  <div class="ql" id="ml">${list.map((x,i)=>`<div class="qi" data-i="${i}"><span class="qn">${i+1}</span><div><b>@${esc(x.c.handle)}</b> ${promoTag(x.v)}<span>${vline(x.v)}</span><br><span>${esc((x.v.cap||'').slice(0,110))}</span></div></div>`).join('')||'<div class="empty">No videos.</div>'}</div></div>
 ${below||''}`;
 $('#ov').classList.add('show');$('#modal').scrollTop=0;document.body.style.overflow='hidden';
 $('#modal .x').onclick=closeM;$('#modal .snd').onclick=()=>setSound(!SOUND);
 $('#mp').onclick=()=>mGo(M.i-1);$('#mn').onclick=()=>mGo(M.i+1);$('#ma').onchange=e=>{M.auto=e.target.checked;armTimer()};
 document.querySelectorAll('#ml .qi').forEach(el=>el.onclick=()=>mGo(+el.dataset.i));
 if(list.length)mGo(start||0);else{const c0=arguments[4];if(c0&&(c0.ig||c0._pf=='instagram')){$('#mfr').style.aspectRatio='auto';$('#mfr').innerHTML=igCTA(c0);}}}
function armTimer(){clearTimeout(M.timer);if(!M.on||!M.auto)return;const x=M.list[M.i];const f=$('#mfr iframe');
 // fallback only if the player never reports state (ended events normally drive auto-advance)
 if(x&&x.v.dur)M.timer=setTimeout(()=>{if(M.on&&M.auto&&f&&!f.dataset.ready)mGo(M.i+1)},(x.v.dur+6)*1000);}
function mGo(i){if(!M.list.length)return;M.i=(i+M.list.length)%M.list.length;const {c,v}=M.list[M.i];
 $('#mfr').replaceChildren(mkFrame(v.id,'modal',{auto:true,loop:false}));
 $('#mnow').innerHTML=`<a href="${c._url}" target="_blank" rel="noopener"><b>@${esc(c.handle)}</b></a> · ${fmt(c.followers)} followers · ${fmt(c.median_views_last20)} median · ${tied(c)?'Tied · '+esc(c._app):'Not tied'}<br>${promoTag(v)}${esc(v.cap)}<br><span class="sub">${vline(v)}</span> · <a href="${vurl(c,v)}" target="_blank" rel="noopener">Open on TikTok ↗</a>`;
 $('#mpos').textContent=`${M.i+1} / ${M.list.length}`;
 document.querySelectorAll('#ml .qi').forEach(el=>el.classList.toggle('cur',+el.dataset.i==M.i));
 const cur=document.querySelector('#ml .qi.cur');if(cur)cur.scrollIntoView({block:'nearest'});armTimer();}
function openCreator(h,start){const c=BY[h];if(!c)return;
 const kv=(k,v)=>`<div class="kv"><small>${k}</small>${v}</div>`;
 openPlayer(`<span class="tier" style="--t:var(--${c.fit})">${c.fit}</span><h2><a href="${c._url}" target="_blank" rel="noopener">@${esc(c.handle)}</a></h2><span class="sub">#${c.rank} · ${fmt(c.followers)} followers · ${fmt(c.median_views_last20)} median · ${tied(c)?'Tied · '+esc(c._app):'Not tied'}</span>${PFB(c)}${igHTML(c)}`,
  c._vids.map(v=>({c,v})),start||0,
  `<div class="mb"><div class="info">
  ${kv('Fit note',esc(c.fit_note))}${kv('App tie',esc(c.app_tie))}${kv('Partnership',esc(c.partnership_type))}${kv('Evidence',esc(c.app_evidence))}
  ${kv('Contact',linkify(c.contact||'—'))}${kv('Style',esc(c.content_style)+' · '+esc(c.language))}${kv('Face on camera',esc(c.face_on_camera))}
  ${kv('Activity',`${c.posts_per_week??'—'} posts/wk · last ${esc(c.last_post)} · ${fmt(c.videos_total)} videos total · median ${c.median_duration_s??'—'}s`)}
  ${kv('Views / follower',c._ratio==null?'—':c._ratio.toFixed(3))}${kv('Top recent video',c.top_recent_video?`<a href="${esc(c.top_recent_video)}" target="_blank" rel="noopener">${fmt(c.top_recent_views)} views ↗</a>`:'—')}
  ${c.ig?kv('Instagram',igHTML(c)+(c.ig.notes?'<br><span class="sub">'+esc(c.ig.notes)+'</span>':'')):''}${kv('Bio',esc(c.bio))}</div></div>`,c);
 history.replaceState(null,'','#'+encodeURIComponent(c.handle));}
// watch queue: strong picks (respects current filters if they include strong creators)
function openQueue(){let base=filtered().filter(c=>c.fit=='strong');if(!base.length)base=D.filter(c=>c.fit=='strong').sort((a,b)=>a.rank-b.rank);
 const L=[];base.forEach(c=>c._vids.forEach(v=>L.push({c,v})));
 openPlayer(`<h2>▶ Watch queue · strong picks</h2><span class="sub">${L.length} videos from ${base.length} creators · auto-advances</span>`,L,0,'');}
$('#queueBtn').onclick=openQueue;
// ---- feed mode: vertical full-screen snap scroll, only the visible video is loaded
let F={on:false,list:[],i:-1,auto:true,timer:null};
const fSecs=()=>document.querySelectorAll('#fsc .fs');
const ioFeed=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting&&e.intersectionRatio>=.6)fActivate(+e.target.dataset.i)}),{root:$('#fsc'),threshold:[0,.6]});
function openFeed(){F.list=filtered().flatMap(c=>c._vids.map(v=>({c,v})));F.i=-1;F.on=true;gridPause();
 const sc=$('#fsc');ioFeed.disconnect();
 sc.innerHTML=F.list.map(({c,v},i)=>`<section class="fs" data-i="${i}"><div class="fbox">${phHTML(v)}</div>
  <div class="finfo"><div class="fh"><a href="${c._url}" target="_blank" rel="noopener">@${esc(c.handle)}</a> <span class="tier" style="--t:var(--${c.fit});font-size:10px">${c.fit}</span></div>
  <div class="fl">${PFB(c)}${tied(c)?`<span class="b tied">Tied · ${esc(c._app)}</span>`:`<span class="b free">Not tied to an app</span>`}<span class="b">${fmt(c.followers)} followers</span><span class="b">${fmt(c.median_views_last20)} median views</span><span class="b">#${c.rank}</span>${igHTML(c)}</div>
  <div class="fcap">${promoTag(v)}${esc(v.cap)}</div><div class="sub">${vline(v)} · <a href="${vurl(c,v)}" target="_blank" rel="noopener">Open on TikTok ↗</a></div></div></section>`).join('')
  ||'<section class="fs"><div class="empty">No creators match these filters.</div></section>';
 $('#feed').classList.add('show');document.body.style.overflow='hidden';sc.scrollTop=0;
 fSecs().forEach(s=>{if(s.dataset.i!=null)ioFeed.observe(s)});if(F.list.length)fActivate(0);
 if(location.hash!='#feed')history.replaceState(null,'','#feed');}
function fActivate(i){if(!F.on||i===F.i||!F.list[i])return;const secs=fSecs();
 if(F.i>=0&&secs[F.i]){secs[F.i].querySelector('.fbox').innerHTML=phHTML(F.list[F.i].v);}
 F.i=i;const box=secs[i].querySelector('.fbox');box.replaceChildren(mkFrame(F.list[i].v.id,'feed',{auto:true,loop:!F.auto}));
 $('#fPos').innerHTML=`${i+1} / ${F.list.length}<span class="lg"> · ${new Set(F.list.map(x=>x.c.handle)).size} creators · scroll, swipe or ↑ ↓</span>`;
 clearTimeout(F.timer);const d=F.list[i].v.dur,f=box.querySelector('iframe');
 if(F.auto&&d)F.timer=setTimeout(()=>{if(F.on&&F.auto&&F.i===i&&!f.dataset.ready)fGo(i+1)},(d+6)*1000);}
function fGo(i){const secs=fSecs();if(i<0||i>=secs.length)return;secs[i].scrollIntoView({behavior:'smooth',block:'start'});}
function closeFeed(){F.on=false;clearTimeout(F.timer);ioFeed.disconnect();$('#fsc').innerHTML='';$('#feed').classList.remove('show');document.body.style.overflow='';
 if(location.hash=='#feed')history.replaceState(null,'',' ');gridResume();}
$('#feedBtn').onclick=openFeed;$('#fClose').onclick=closeFeed;$('#fUp').onclick=()=>fGo(F.i-1);$('#fDn').onclick=()=>fGo(F.i+1);
$('#fAuto').onchange=e=>{F.auto=e.target.checked;};
$('#fsc').addEventListener('click',e=>{const ph=e.target.closest('.fs .ph');if(ph){const i=+ph.closest('.fs').dataset.i;if(i!==F.i)fGo(i);else{const f=$('#fsc .fs[data-i="'+i+'"] iframe');playF(f);}}});
// ---- keyboard
document.addEventListener('keydown',e=>{if(F.on){if(e.key=='Escape')closeFeed();if(['ArrowDown','j','PageDown'].includes(e.key)){e.preventDefault();fGo(F.i+1)}if(['ArrowUp','k','PageUp'].includes(e.key)){e.preventDefault();fGo(F.i-1)}return;}
 if(!M.on)return;if(e.key=='Escape')closeM();if(e.key=='ArrowRight')mGo(M.i+1);if(e.key=='ArrowLeft')mGo(M.i-1);});
// ---- messages from TikTok players
window.addEventListener('message',e=>{let host;try{host=new URL(e.origin).hostname}catch(_){return}if(!/(^|\.)tiktok\.com$/.test(host))return;
 let d=e.data;if(typeof d=='string'){try{d=JSON.parse(d)}catch(_){return}}if(!d||!d['x-tiktok-player'])return;
 const f=[...document.querySelectorAll('iframe[data-tt]')].find(x=>x.contentWindow===e.source);if(!f)return;const ctx=f.dataset.tt;
 if(d.type=='onPlayerReady'){f.dataset.ready='1';if(f.dataset.play=='1'){send(f,SOUND?'unMute':'mute');send(f,'play');}else send(f,'mute');}
 else if(d.type=='onPlayerError'){const v=d.value||{};if((v.errorCode==3002||v.errorType=='AUTOPLAY_ERROR')&&f.dataset.play=='1'){send(f,'mute');send(f,'play');}}
 else if(d.type=='onStateChange'){
  if(d.value===1&&ctx=='card'){const card=f.closest('.card');if(card&&card!==ACTIVE)setActive(card,true);}
  if(d.value===0){if(ctx=='modal'&&M.on&&M.auto&&f.closest('#mfr'))mGo(M.i+1);
   else if(ctx=='feed'&&F.on&&F.auto){const s=f.closest('.fs');if(s&&+s.dataset.i===F.i)fGo(F.i+1);}}}});
render();
if(location.hash=='#feed')openFeed();else if(location.hash.length>1)openCreator(decodeURIComponent(location.hash.slice(1)),0);
window.DASH_VERSION='v4-platforms';
</script>
</body></html>
